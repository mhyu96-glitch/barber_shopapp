name: barberpro
description: "BarberPro Studio - Sistem Manajemen Barbershop Profesional & Multi-Tenant Digital Dashboard."
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: ^0.18.1
  supabase_flutter: ^2.5.4
  flutter_thermal_printer: ^1.2.0
  esc_pos_utils_plus: ^2.0.3
  permission_handler: ^11.3.1
  image_picker: ^1.0.4
  image: ^4.1.3
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/launcher_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/launcher_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0D0D0D"
  image: "assets/icon/launcher_icon.png"
  android: true
  ios: true
  fullscreen: true
