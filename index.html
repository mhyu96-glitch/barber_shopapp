<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BarberPro - Sistem Manajemen Barbershop Profesional. Kelola jadwal, booking, pembayaran, dan pelanggan dengan mudah." />
  <title>BarberPro - Manajemen Barbershop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            "background": "#131313",
            "surface": "#131313",
            "surface-container": "#201f1f",
            "surface-container-low": "#1c1b1b",
            "surface-container-high": "#2a2a2a",
            "surface-container-highest": "#353534",
            "surface-container-lowest": "#0e0e0e",
            "primary": "#f6ca22",
            "primary-container": "#d7ae00",
            "on-primary": "#3c2f00",
            "secondary": "#e7c351",
            "on-surface": "#e5e2e1",
            "on-surface-variant": "#d0c5af",
            "outline": "#99907c",
            "outline-variant": "#4d4635",
            "error": "#ffb4ab",
          },
          fontFamily: {
            "headline": ["Epilogue", "Manrope", "sans-serif"],
            "body": ["Manrope", "Inter", "sans-serif"],
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .gold-gradient { background: linear-gradient(135deg, #FFD700 0%, #D4AF37 100%); }
    .brass-gradient { background: linear-gradient(135deg, #FFD700 0%, #D4AF37 100%); }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="main-content" class="main-content">
      <div id="page-container"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
